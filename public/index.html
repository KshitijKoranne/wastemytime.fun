<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waste My Time</title>
<meta name="description" content="Small, strange games for the minutes you have to spare.">
<meta property="og:title" content="Waste My Time">
<meta property="og:description" content="Small, strange games for the minutes you have to spare.">
<meta property="og:image" content="https://wastemytime.fun/tiles/truth-booth.jpg">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/assets/art/ticket.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1a17;--muted:#6f6760;--red:#c8352d;--bg:#ffffff;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  padding:calc(48px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
header{text-align:center;margin:0 auto 40px;max-width:640px}
h1{margin:0;font-family:"Alfa Slab One",Georgia,serif;font-weight:400;font-size:clamp(40px,9vw,64px);line-height:1;letter-spacing:-.01em}
header p{margin:12px 0 0;font-size:18px;color:var(--muted)}
.grid{list-style:none;margin:0 auto;padding:0;max-width:960px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,240px));justify-content:center;gap:32px 26px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:24px 14px}.grid h2{font-size:16px}.grid p{font-size:13.5px}.new{top:8px;left:8px}}
.grid a{display:block;color:inherit;text-decoration:none}
.tile{position:relative;display:block;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#0b0e16;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 24px -14px rgba(0,0,0,.45);transition:transform .15s,box-shadow .15s}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
.grid a:hover .tile,.grid a:focus-visible .tile{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.08),0 18px 30px -14px rgba(0,0,0,.5)}
.grid a:focus-visible{outline:none}
.grid a:focus-visible .tile{outline:3px solid var(--red);outline-offset:3px}
.new{position:absolute;top:12px;left:12px;background:var(--red);color:#fff;font-weight:700;font-size:12px;padding:4px 9px;border-radius:999px}
.grid h2{margin:12px 2px 2px;font-size:18px;font-weight:700}
.grid p{margin:0 2px;font-size:14.5px;line-height:1.4;color:var(--muted)}
footer{margin:64px auto 0;text-align:center;font-size:14px;color:var(--muted)}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Waste My Time</h1>
  <p>Small, strange games for the minutes you have to spare.</p>
</header>
<ul class="grid">
  <li><a href="/truth-booth"><span class="tile"><img src="/tiles/truth-booth.jpg" alt="" width="600" height="600"></span><h2>Truth Booth</h2><p>Stamp strange claims real or fake.</p></a></li>
  <li><a href="/guess-the-weight"><span class="tile"><img src="/tiles/guess-the-weight.jpg" alt="" width="600" height="600"><span class="new">New</span></span><h2>Guess the Weight</h2><p>How heavy is a cloud?</p></a></li>
  <li><a href="/night-ride"><span class="tile"><img src="/tiles/night-ride.jpg" alt="" width="600" height="600"><span class="new">New</span></span><h2>Night Ride</h2><p>A turn on the big wheel after dark.</p></a></li>
</ul>
<footer>Made by <a href="https://kjrlabs.in">KJR Labs</a></footer>
</body>
</html>
